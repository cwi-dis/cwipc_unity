# CI for cwipc_unity: run the EditMode tests of the package (nl.cwi.dis.cwipc/Tests)
# in the development projects, against an installed cwipc. See cwi-dis/cwipc_unity#63.
# cwipc_unity_develop_urp on all platforms; cwipc_unity_develop_birp (no URP) on macOS
# arm64 with a graphics device, so the shaders really compile there (#72, #55).
#
# Why game-ci's unity-builder and not its unity-test-runner: the test runner only
# runs Unity in Docker (Linux, Windows), where the cwipc installed on the runner
# isn't visible. The builder runs Unity directly on macOS runners; it calls
# Cwipc.Tests.CiTestRunner.RunEditModeTests (nl.cwi.dis.cwipc/Tests/Editor) instead of a build.
#
# Secrets (same as VRTApp-Trolley, Unity Personal): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.

name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      cwipc-version:
        description: 'cwipc version to test against: a release tag, or master (macOS: brew --HEAD)'
        required: false
        default: 'v8.3.0'
      gpu:
        description: 'macOS: also run the URP jobs with a graphics device (unity-builder enableGpu); the BIRP job always has one'
        type: boolean
        required: false
        default: false

jobs:
  # Cheap checks without Unity, on every push.
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Every URP SubShader must have PackageRequirements, or projects without URP get
      # shader compile errors (#55). Unity itself only reports that with a graphics device.
      - name: URP SubShaders can be skipped without URP
        run: python3 .github/scripts/check_urp_subshaders.py nl.cwi.dis.cwipc

  test-macos:
    name: EditMode tests (macOS ${{ matrix.arch }}, ${{ matrix.project }})
    # macOS runners are scarce: only on master, or when started by hand (workflow_dispatch,
    # also on a branch). Pushes to other branches run the Linux and Windows jobs only.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            project: urp
            hub-arch: arm64
            hub-sha256: e04d0320daf5df3d460435320222d8f4981f1388ecb0b5b22482ad98a9bbbf85
          # The BIRP project, without URP: with a graphics device Unity compiles the
          # shaders, so ShaderTests catches a URP SubShader without PackageRequirements
          # (#55); the macOS runners have a Metal device (seen in run 44416168334).
          - arch: arm64
            runner: macos-15
            project: birp
            gpu: true
            hub-arch: arm64
            hub-sha256: e04d0320daf5df3d460435320222d8f4981f1388ecb0b5b22482ad98a9bbbf85
          # Intel: as long as cwipc and this package support Intel Macs. It is the only job
          # that exercises the standard-library-path branch of _load_cwipc_util() on macOS.
          - arch: intel
            runner: macos-15-intel
            project: urp
            hub-arch: x64
            hub-sha256: ec2b1cea97ba8c418cd87c9e216294224ac7cee393fa84c6d6b1d98d1f963b92
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: cwipc_unity_develop_${{ matrix.project }}/Library
          key: Library-macOS-${{ matrix.arch }}-${{ matrix.project }}-${{ hashFiles(format('cwipc_unity_develop_{0}/Packages/**', matrix.project), format('cwipc_unity_develop_{0}/ProjectSettings/**', matrix.project), 'nl.cwi.dis.cwipc/package.json') }}
          restore-keys: |
            Library-macOS-${{ matrix.arch }}-${{ matrix.project }}-

      # The action and cwipc both from the v8.3.0 release (cwi-dis/cwipc#354). To test
      # against cwipc master, run the workflow by hand with cwipc-version: master (not
      # nightly: on macOS the action's brew method only knows master, brew --HEAD).
      - id: cwipc
        uses: cwi-dis/cwipc/.github/actions/install-cwipc@v8.3.0
        with:
          version: ${{ inputs.cwipc-version || 'v8.3.0' }}

      # Temporary workaround: Unity Hub 3.22.6 instead of brew's latest. Hub 4.x no longer
      # supports the headless install unity-builder v5.0.1 uses ("'install' is not supported
      # by the native Unity Hub"), and the builder's unityHubVersionOnMac input can't pin a
      # 3.x (brew has no versioned unity-hub cask). The builder skips its own Hub install when
      # /Applications/Unity Hub.app exists. URL and sha256 from the Homebrew cask for 3.22.6.
      - name: Unity Hub 3.22.6
        run: |
          v=3.22.6
          dmg="$RUNNER_TEMP/UnityHubSetup.dmg"
          curl -fsSL -o "$dmg" "https://public-cdn.cloud.unity3d.com/hub/prod/$v/UnityHubSetup-$v-${{ matrix.hub-arch }}.dmg"
          echo "${{ matrix.hub-sha256 }}  $dmg" | shasum -a 256 -c -
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's/.*\(\/Volumes\/.*\)$/\1/p' | tail -1)
          cp -R "$mnt/Unity Hub.app" /Applications/
          hdiutil detach "$mnt"

      # Pinned to an exact version: @v5 may move to the CLI-based builder (game-ci/cli), and
      # that switch should be a deliberate change here.
      - name: Run EditMode tests
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CWIPC_TEST_RESULTS: ${{ github.workspace }}/test-results/editmode.xml
        with:
          projectPath: cwipc_unity_develop_${{ matrix.project }}
          targetPlatform: StandaloneOSX
          # Without -nographics for the BIRP job, and for all when started by hand with gpu=true.
          enableGpu: ${{ (matrix.gpu || inputs.gpu) && 'true' || '' }}
          unityVersion: auto
          buildMethod: Cwipc.Tests.CiTestRunner.RunEditModeTests

      - id: artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos-${{ matrix.arch }}-${{ matrix.project }}
          path: test-results/
          if-no-files-found: warn

      # Our own job summary (totals, and per failed test its message, stack trace and log
      # output); also fails the job if no tests ran. Same script on every platform.
      - name: Test summary
        if: always()
        run: >
          python3 .github/scripts/test_summary.py
          --label "EditMode tests (macOS ${{ matrix.arch }}, ${{ matrix.project }})"
          --artifact-url "${{ steps.artifact.outputs.artifact-url }}"
          --log-hint "More in the job log: step **Run EditMode tests**, search for \`CiTestRunner: Failed: {test}\` (the log output of the test comes just before it)."
          test-results/editmode.xml

  # Linux: game-ci runs Unity in a Docker container. cwipc comes in through a custom image,
  # game-ci's image plus cwipc's -built- archive (.github/docker/linux/Dockerfile, #71).
  test-linux:
    name: EditMode tests (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: cwipc_unity_develop_urp/Library
          key: Library-Linux-${{ hashFiles('cwipc_unity_develop_urp/Packages/**', 'cwipc_unity_develop_urp/ProjectSettings/**', 'nl.cwi.dis.cwipc/package.json') }}
          restore-keys: |
            Library-Linux-

      - id: unity
        name: Unity version of the project
        run: |
          echo "version=$(sed -n 's/^m_EditorVersion: //p' cwipc_unity_develop_urp/ProjectSettings/ProjectVersion.txt)" >> "$GITHUB_OUTPUT"

      - name: Build the image with cwipc
        run: |
          docker build \
            --build-arg UNITY_VERSION=${{ steps.unity.outputs.version }} \
            --build-arg CWIPC_VERSION=${{ inputs.cwipc-version == 'master' && 'nightly' || inputs.cwipc-version || 'v8.3.0' }} \
            -t cwipc-unity-ci:linux .github/docker/linux

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # game-ci reads the token for its GitHub API calls from the environment, not from
          # its githubToken input; anonymous calls hit the shared per-IP rate limit (403).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: cwipc_unity_develop_urp
          testMode: editmode
          customImage: cwipc-unity-ci:linux
          # Pinned: no "latest" lookup, reproducible runs. Update deliberately.
          cliVersion: v0.1.76
          artifactsPath: test-results-linux
          checkName: EditMode tests (Linux)

      - id: artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: test-results-linux/
          if-no-files-found: warn

      # Our own summary and check, as on macOS and Windows: game-ci's test runner can report
      # success without having run any test (seen on Windows: Unity failed to start).
      - name: Test summary
        if: always()
        run: >
          python3 .github/scripts/test_summary.py
          --label "EditMode tests (Linux)"
          --artifact-url "${{ steps.artifact.outputs.artifact-url }}"
          --log-hint "More in the check **EditMode tests (Linux)** (game-ci's test report), and in the job log, step **Run EditMode tests**."
          test-results-linux/editmode-results.xml

  # Windows: as Linux, with .github/docker/windows/Dockerfile (#71). game-ci's Windows images
  # are Windows Server 2022, so this needs a windows-2022 runner.
  test-windows:
    name: EditMode tests (Windows)
    runs-on: windows-2022
    permissions:
      contents: read
      checks: write
    steps:
      # The Docker service sometimes isn't running when a windows-2022 runner starts
      # (actions/runner-images#13729): start it. Remove once that is fixed (#100).
      - name: Docker issue workaround
        id: docker-workaround
        run: |
          $dockerState = Get-Service -Name "docker"
          if ($dockerState.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: cwipc_unity_develop_urp/Library
          key: Library-Windows-${{ hashFiles('cwipc_unity_develop_urp/Packages/**', 'cwipc_unity_develop_urp/ProjectSettings/**', 'nl.cwi.dis.cwipc/package.json') }}
          restore-keys: |
            Library-Windows-

      - id: unity
        name: Unity version of the project
        shell: bash
        run: |
          echo "version=$(sed -n 's/^m_EditorVersion: //p' cwipc_unity_develop_urp/ProjectSettings/ProjectVersion.txt | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Build the image with cwipc
        shell: bash
        run: |
          docker build \
            --build-arg UNITY_VERSION=${{ steps.unity.outputs.version }} \
            --build-arg CWIPC_VERSION=${{ inputs.cwipc-version == 'master' && 'nightly' || inputs.cwipc-version || 'v8.3.0' }} \
            -t cwipc-unity-ci:windows .github/docker/windows

      # Temporary workaround: unity-builder (with CiTestRunner, as on macOS) instead of
      # unity-test-runner, whose Windows script (game-ci/cli v0.1.76) doesn't wait for Unity:
      # it reports success at once and stops the container mid-import. Blocked on
      # game-ci/cli#318: back to the test runner once that is fixed. The builder starts Unity with
      # -nographics and -silent-crashes and waits for it (dist/platforms/windows/build.ps1).
      - name: Run EditMode tests
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: cwipc_unity_develop_urp
          targetPlatform: StandaloneWindows64
          unityVersion: auto
          customImage: cwipc-unity-ci:windows
          buildMethod: Cwipc.Tests.CiTestRunner.RunEditModeTests

      - id: artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: |
            cwipc_unity_develop_urp/test-results/
            test-results/
          if-no-files-found: warn

      # CiTestRunner writes test-results/editmode.xml relative to Unity's working directory
      # (CWIPC_TEST_RESULTS isn't passed into the container): the project directory, or the
      # workspace; the script takes the first that exists. Windows has python, not python3.
      - name: Test summary
        if: always()
        shell: bash
        run: >
          python .github/scripts/test_summary.py
          --label "EditMode tests (Windows)"
          --artifact-url "${{ steps.artifact.outputs.artifact-url }}"
          --log-hint "More in the job log: step **Run EditMode tests**, search for \`CiTestRunner: Failed: {test}\` (the log output of the test comes just before it)."
          cwipc_unity_develop_urp/test-results/editmode.xml test-results/editmode.xml
